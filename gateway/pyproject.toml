[project]
name = "herdr-notify"
version = "0.1.5"
description = "Gateway that mirrors herdr agent state to Android push notifications and a secure control plane."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    # Ed25519 and P-256 verification for signed requests. A base dependency
    # rather than an extra: api/auth/verify.py imports it at module scope, and
    # an auth layer that silently disappears when an extra is missing is the
    # opposite of what this project is for.
    "cryptography>=43",
    # QR symbol generation for `enroll --qr`. segno is pure Python with no
    # transitive dependencies and no Pillow/native image backend: it computes
    # the module matrix, and herdr_notify.pairing renders it as terminal blocks,
    # so nothing here pulls in an image stack for a string of output.
    "segno>=1.6",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
]
push = [
    "firebase-admin>=6.5",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
herdr-notify = "herdr_notify.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herdr_notify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Integration tests talk to a real, running herdr server. They are read-only but
# they are not hermetic, so they stay opt-in.
addopts = "-m 'not integration'"
markers = [
    "integration: requires a running herdr server",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's documented idiom is Depends()/Header() in argument defaults; the
# call must be evaluated per-request for the dependency to be injected at all.
"src/herdr_notify/api/app.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# firebase-admin ships no py.typed marker. Every call into it is already
# funnelled through three narrow wrappers (credential_file, build_message,
# FcmSender.send) whose signatures this project controls, so untyped internals
# cannot leak into the typed surface.
module = ["firebase_admin.*"]
ignore_missing_imports = true

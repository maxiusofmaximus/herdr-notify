org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 enables built-in Kotlin for every AGP module automatically, so
# `org.jetbrains.kotlin.android` is not applied anywhere in this project. Setting
# this to false would re-introduce the duplicate `kotlin` extension that the
# built-in support conflicts with.
android.builtInKotlin=true

# KSP contributes its generated sources through the `kotlin.sourceSets` DSL,
# which built-in Kotlin rejects by default. Nothing in this project adds Kotlin
# source directories by hand, so relaxing the check only affects the KSP output
# directory. See https://developer.android.com/r/tools/built-in-kotlin
android.disallowKotlinSourceSets=false

kotlin.code.style=official

# xcodegen spec for the hello200 iOS app (RFC v8b). Generate with: xcodegen generate
# The app source is shared with the macOS SwiftPM build: ../swift/Sources/Hello200App.swift
name: hello200
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    TARGETED_DEVICE_FAMILY: "1"
targets:
  hello200:
    type: application
    platform: iOS
    sources:
      - path: ../swift/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.herdrnotify.hello200
        PRODUCT_NAME: hello200
